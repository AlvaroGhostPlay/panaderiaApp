<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { background-color: #ffffff; padding: 20px; border-radius: 8px; }
        .button { background-color: #007bff; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <h1>¡Hola, <span th:text="${nombre}">Usuario</span>!</h1>
    <p th:text="${mensaje}">Bienvenido a nuestra plataforma.</p>
    <p>Tu código de verificación es: <b th:text="${codigo}">0000</b></p>
    <br>
    <a th:href="${url}" class="button">Confirmar Cuenta</a>
</div>
</body>
</html>
