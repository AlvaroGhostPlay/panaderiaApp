services:

  postgres-db:
    image: postgres:17-alpine
    container_name: postgres-db

    environment:
      POSTGRES_DB: store-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sasa

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store-db"]
      interval: 5s
      timeout: 5s
      retries: 15

    networks:
      - red-panaderia


  redis-bff:
    image: redis:7-alpine
    container_name: redis-bff

    ports:
      - "6379:6379"

    volumes:
      - redis-bff-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

    networks:
      - red-panaderia


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq

    ports:
      - "15672:15672"

    networks:
      - red-panaderia


  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    container_name: eureka-server

    ports:
      - "8761:8761"

    environment:
      SERVER_NAME: eureka-server
      SERVER_PORT: "8761"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"

    networks:
      - red-panaderia


  msvc-users-roles:
    build:
      context: ./msvc-users_roles
      dockerfile: Dockerfile

    container_name: msvc-users-roles

    environment:
      SERVER_NAME: msvc-users-roles
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"

      DATABASE_URL: "jdbc:postgresql://postgres-db:5432/store-db"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: sasa

      JPA_SHOW_SQL: "true"
      JPA_SHOW_FORMAT_SQL: "true"

    depends_on:
      postgres-db:
        condition: service_healthy

      eureka-server:
        condition: service_started

    networks:
      - red-panaderia


  msvc-clients:
    build:
      context: ./msvc-clients
      dockerfile: Dockerfile

    container_name: msvc-clients

    environment:
      SERVER_NAME: msvc-clients
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"

      DATABASE_URL: "jdbc:postgresql://postgres-db:5432/store-db"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: sasa

      JPA_SHOW_SQL: "true"
      JPA_SHOW_FORMAT_SQL: "true"

    depends_on:
      postgres-db:
        condition: service_healthy

      eureka-server:
        condition: service_started

    networks:
      - red-panaderia


  auth-server:
    build:
      context: ./auth-service
      dockerfile: Dockerfile

    container_name: auth-server

    ports:
      - "9000:9000"

    environment:
      AUTH_DB_URL: "jdbc:postgresql://postgres-db:5432/store-db?currentSchema=storedb"
      AUTH_DB_USERNAME: postgres
      AUTH_DB_PASSWORD: sasa

      EUREKA_URL: "http://eureka-server:8761/eureka/"

      USERS_SERVICE_URL: "http://msvc-users-roles"

      AUTH_ISSUER: "http://panaderia.test:9000"

      FRONTEND_ORIGIN: "http://localhost:4200"
      FRONTEND_LOGIN_URL: "http://localhost:4200/login"

      GATEWAY_CLIENT_ID: "gateway-bff"
      GATEWAY_CLIENT_SECRET: "gateway-secret-dev"

      GATEWAY_REDIRECT_URI: "http://panaderia.test:8080/login/oauth2/code/bff"

      AUTH_JWT_KEYSTORE: "file:/app/secrets/auth-server.p12"
      AUTH_JWT_KEYSTORE_PASSWORD: "changeit"
      AUTH_JWT_KEY_ALIAS: "auth-server"
      AUTH_JWT_KEY_PASSWORD: "changeit"
      AUTH_JWT_KEY_ID: "auth-key-dev-01"

    volumes:
      - ./auth-service/secrets:/app/secrets:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9000/actuator/health | grep -q '\"status\":\"UP\"'"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    depends_on:
      postgres-db:
        condition: service_healthy

      eureka-server:
        condition: service_started

      msvc-users-roles:
        condition: service_started

    networks:
      red-panaderia:
        aliases:
          - panaderia.test


  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile

    container_name: gateway

    ports:
      - "8080:8080"

    environment:
      SERVER_NAME: gateway

      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"

      REDIS_HOST: redis-bff
      REDIS_PORT: "6379"

      AUTH_ISSUER: "http://panaderia.test:9000"

      GATEWAY_CLIENT_ID: "gateway-bff"
      GATEWAY_CLIENT_SECRET: "gateway-secret-dev"

      GATEWAY_REDIRECT_URI: "http://panaderia.test:8080/login/oauth2/code/bff"

      FRONTEND_URL: "http://localhost:4200"

    depends_on:
      redis-bff:
        condition: service_healthy

      auth-server:
        condition: service_healthy

      eureka-server:
        condition: service_started

      msvc-users-roles:
        condition: service_started

      msvc-clients:
        condition: service_started

    networks:
      - red-panaderia


  images-service:
    build:
      context: ./images-service
      dockerfile: Dockerfile

    container_name: images-service

    environment:
      SERVER_NAME: images-service
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"

    depends_on:
      - eureka-server

    networks:
      - red-panaderia


  msvc-messaging:
    build:
      context: ./msvc-messaging
      dockerfile: Dockerfile

    container_name: msvc-messaging

    environment:
      SERVER_NAME: msvc-messaging

      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"

      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest

      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: "587"
      EMAIL_USER: alvarox129.edu@gmail.com
      EMAIL_PASSWORD: wfdcarcawhdkbjla

      SERVER_PORT: "8085"

    depends_on:
      - eureka-server
      - rabbitmq
      - images-service

    networks:
      - red-panaderia


  msvc-content:
    build:
      context: ./msvc-nadbar
      dockerfile: Dockerfile

    container_name: msvc-content

    environment:
      SERVER_NAME: msvc-content

      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"

      DATABASE_URL: "jdbc:postgresql://postgres-db:5432/store-db"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: sasa

      JPA_SHOW_SQL: "true"
      JPA_SHOW_FORMAT_SQL: "true"

    depends_on:
      postgres-db:
        condition: service_healthy

      eureka-server:
        condition: service_started

    networks:
      - red-panaderia


volumes:
  postgres-data:
  redis-bff-data:


networks:
  red-panaderia:
    driver: bridge